<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pantryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle with padding for safe maskable area -->
  <rect width="512" height="512" rx="112" fill="url(#pantryGrad)" />

  <!-- Inner Pantry Basket / Bag illustration -->
  <g transform="translate(64, 56)" filter="url(#shadow)">
    <!-- Bag / Container Body -->
    <path d="M 52 140 L 80 340 C 84 362 102 378 124 378 L 260 378 C 282 378 300 362 304 340 L 332 140 Z" fill="#ffffff" opacity="0.98" />
    
    <!-- Bag Fold / Top Rim -->
    <rect x="42" y="120" width="300" height="32" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="4" />
    
    <!-- Smart Fresh Leaf (Left) -->
    <path d="M 120 120 C 120 50 180 30 192 120 C 150 120 120 120 120 120 Z" fill="#34d399" />
    <path d="M 120 120 Q 160 80 192 120" stroke="#059669" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Timer / Smart Clock Dial (Center) -->
    <circle cx="192" cy="240" r="64" fill="#f0fdf4" stroke="#059669" stroke-width="8" />
    <circle cx="192" cy="240" r="6" fill="#059669" />
    <!-- Clock hands pointing to express urgency/countdown -->
    <line x1="192" y1="240" x2="192" y2="200" stroke="#059669" stroke-width="6" stroke-linecap="round" />
    <line x1="192" y1="240" x2="225" y2="240" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />

    <!-- Urgent Fresh Dots / Spark -->
    <circle cx="140" cy="180" r="10" fill="#10b981" />
    <circle cx="244" cy="180" r="10" fill="#f59e0b" />
    <circle cx="192" cy="325" r="8" fill="#ef4444" />
  </g>
</svg>
